name: Deploy Web → Cloudflare Pages

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Ensure web platform
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name peeke_cmms_erp --platforms=web
          fi

      - name: Brand favicon + PWA icons with Peeke logo
        run: |
          mkdir -p web/icons
          ICON="assets/branding/peeke_icon.png"
          if [ ! -f "$ICON" ]; then
            echo "Missing $ICON" >&2
            exit 1
          fi

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi

          # Lanczos + mild sharpen keeps the wordmark readable at shortcut size
          resize() {
            local size="$1" out="$2"
            convert "$ICON" -filter Lanczos -resize "${size}x${size}" \
              -unsharp 0x0.75+0.75+0.02 "$out"
          }

          resize 32  web/favicon.png
          resize 192 web/icons/Icon-192.png
          resize 512 web/icons/Icon-512.png
          resize 192 web/icons/Icon-maskable-192.png
          resize 512 web/icons/Icon-maskable-512.png
          resize 180 web/icons/apple-touch-icon.png

          ls -la web/favicon.png web/icons/

      - run: flutter pub get

      - name: Build web
        env:
          SUPABASE_URL_INPUT: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY_INPUT: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DEFAULT_URL="https://tappfahlaiixctyliesz.supabase.co"
          DEFAULT_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcHBmYWhsYWlpeGN0eWxpZXN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzY5NTYsImV4cCI6MjEwMTE1Mjk1Nn0.Z-QK46G21yBuOy0Y3QcNAP_gMfmr_Jo1pRZ1ZKwRvV4"

          URL="${SUPABASE_URL_INPUT:-$DEFAULT_URL}"
          KEY="$SUPABASE_ANON_KEY_INPUT"

          if [ ${#KEY} -lt 100 ]; then
            echo "SUPABASE_ANON_KEY secret is missing or too short (len=${#KEY}). Using clean-slate default JWT."
            KEY="$DEFAULT_KEY"
          fi

          echo "Building with SUPABASE_URL=$URL (key length ${#KEY})"
          flutter build web --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="$URL" \
            --dart-define=SUPABASE_ANON_KEY="$KEY"

          mkdir -p build/web/icons
          cp -f web/favicon.png build/web/favicon.png 2>/dev/null || true
          cp -f web/favicon.svg build/web/favicon.svg 2>/dev/null || true
          cp -f web/icons/* build/web/icons/ 2>/dev/null || true

          printf '/*    /index.html   200\n' > build/web/_redirects
          echo "Published icons:"
          ls -la build/web/favicon* build/web/icons/ || true

      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: peeke-cmms-erp
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Deployment summary
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Git branch:** \`${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment URL:** ${{ steps.cloudflare.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** ${{ steps.cloudflare.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
