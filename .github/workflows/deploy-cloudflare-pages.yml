name: Deploy Web → Cloudflare Pages

# Primary: redesign/gloss-restrained-full-depth
# Preview: infra/powersync-cloud-bootstrap (and workflow_dispatch)
on:
  push:
    branches:
      - redesign/gloss-restrained-full-depth
      - infra/powersync-cloud-bootstrap
  workflow_dispatch:

jobs:
  dry-run:
    name: Dry run (analyze)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-web
      - name: Ensure web platform
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name peeke_cmms_erp --platforms=web
          fi
      - run: flutter pub get
      # Fail only on analyzer *errors*. Pre-existing infos/warnings must not block preview.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  deploy:
    name: Build Flutter Web & Deploy
    needs: dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-web
      - name: Ensure web platform
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name peeke_cmms_erp --platforms=web
          fi
      - name: Brand icons
        run: |
          mkdir -p web/icons
          ICON="assets/branding/peeke_icon.png"
          if [ ! -f "$ICON" ]; then echo "Missing $ICON" >&2; exit 1; fi
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          resize() { convert "$ICON" -filter Lanczos -resize "${1}x${1}" -unsharp 0x0.75+0.75+0.02 "$2"; }
          resize 32 web/favicon.png
          resize 192 web/icons/Icon-192.png
          resize 512 web/icons/Icon-512.png
          resize 192 web/icons/Icon-maskable-192.png
          resize 512 web/icons/Icon-maskable-512.png
          resize 180 web/icons/apple-touch-icon.png
      - run: flutter pub get
      - name: Build web
        env:
          SUPABASE_URL_INPUT: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY_INPUT: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DEFAULT_URL="https://tappfahlaiixctyliesz.supabase.co"
          DEFAULT_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcHBmYWhsYWlpeGN0eWxpZXN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzY5NTYsImV4cCI6MjEwMTE1Mjk1Nn0.Z-QK46G21yBuOy0Y3QcNAP_gMfmr_Jo1pRZ1ZKwRvV4"
          URL="${SUPABASE_URL_INPUT:-$DEFAULT_URL}"
          KEY="$SUPABASE_ANON_KEY_INPUT"
          if [ ${#KEY} -lt 100 ]; then KEY="$DEFAULT_KEY"; fi
          flutter build web --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="$URL" \
            --dart-define=SUPABASE_ANON_KEY="$KEY"
          mkdir -p build/web/icons
          cp -f web/favicon.png build/web/favicon.png 2>/dev/null || true
          cp -f web/icons/* build/web/icons/ 2>/dev/null || true
          printf '/*    /index.html   200\n' > build/web/_redirects
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=peeke-web --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
