name: Deploy Web → Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Ensure web platform
        run: |
          if [ ! -d web ]; then
            flutter create . --project-name peeke_cmms_erp --platforms=web
          fi

      - run: flutter pub get

      # IMPORTANT: an empty --dart-define OVERRIDES Dart defaultValue.
      # Fall back to clean-slate project keys when secrets/vars are unset.
      - name: Build web
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://tappfahlaiixctyliesz.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcHBmYWhsYWlpeGN0eWxpZXN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NzY5NTYsImV4cCI6MjEwMTE1Mjk1Nn0.Z-QK46G21yBuOy0Y3QcNAP_gMfmr_Jo1pRZ1ZKwRvV4}"
          if [ -z "$KEY" ]; then
            echo "SUPABASE_ANON_KEY is empty" >&2
            exit 1
          fi
          echo "Building with SUPABASE_URL=$URL (key length ${#KEY})"
          flutter build web --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL="$URL" \
            --dart-define=SUPABASE_ANON_KEY="$KEY"
          printf '/*    /index.html   200\n' > build/web/_redirects

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: peeke-cmms-erp
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
