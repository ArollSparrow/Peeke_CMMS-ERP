name: Delete old APK artifacts

on:
  workflow_dispatch:
  # Optional: uncomment to auto-run daily and keep storage clear
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  delete-old-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Delete APK artifacts older than 5 hours
        env:
          OWNER: ArollSparrow
          REPO: Peeke_CMMS-ERP
          THRESHOLD_HOURS: "5"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${THRESHOLD_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff (UTC): $cutoff"
          echo "Matching artifact names: peeke-cmms-erp-debug (and *apk*)"

          deleted=0
          skipped=0
          page=1

          while true; do
            resp=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts?per_page=100&page=${page}")

            count=$(echo "$resp" | jq '.artifacts | length')
            if [ "$count" = "0" ] || [ "$count" = "null" ]; then
              echo "No artifacts on page $page — done."
              break
            fi

            # APK uploads use name peeke-cmms-erp-debug; also catch any *apk* name.
            mapfile -t rows < <(echo "$resp" | jq -r --arg cutoff "$cutoff" '
              .artifacts[]
              | select(
                  ((.name | test("peeke-cmms-erp-debug"; "i")) or (.name | test("apk"; "i")))
                  and (.created_at < $cutoff)
                  and (.expired == false)
                )
              | "\(.id)\t\(.name)\t\(.created_at)\t\(.size_in_bytes)"
            ')

            if [ ${#rows[@]} -eq 0 ]; then
              echo "Page $page: nothing matching older than cutoff."
            else
              for row in "${rows[@]}"; do
                id=$(echo "$row" | cut -f1)
                name=$(echo "$row" | cut -f2)
                created=$(echo "$row" | cut -f3)
                size=$(echo "$row" | cut -f4)
                echo "Deleting id=$id name=$name created=$created size=${size}B ..."
                code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${id}")
                if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                  deleted=$((deleted + 1))
                  echo "  OK ($code)"
                else
                  skipped=$((skipped + 1))
                  echo "  SKIP http=$code"
                fi
              done
            fi

            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Done. deleted=$deleted skipped=$skipped"
