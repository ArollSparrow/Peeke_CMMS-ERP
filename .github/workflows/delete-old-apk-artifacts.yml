name: Delete old APK artifacts

on:
  workflow_dispatch:
    inputs:
      delete_all:
        description: "Delete ALL APK artifacts (not only older than 5h)"
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  delete-old-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Delete APK artifacts
        env:
          OWNER: ArollSparrow
          REPO: Peeke_CMMS-ERP
          THRESHOLD_HOURS: "5"
          DELETE_ALL: ${{ inputs.delete_all }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${THRESHOLD_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "DELETE_ALL=$DELETE_ALL"
          echo "Cutoff (UTC, used only when DELETE_ALL=false): $cutoff"

          deleted=0
          skipped=0
          page=1

          while true; do
            resp=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts?per_page=100&page=${page}")

            count=$(echo "$resp" | jq '.artifacts | length')
            if [ "$count" = "0" ] || [ "$count" = "null" ]; then
              echo "No artifacts on page $page — done."
              break
            fi

            if [ "$DELETE_ALL" = "true" ]; then
              mapfile -t rows < <(echo "$resp" | jq -r '
                .artifacts[]
                | select(
                    ((.name | test("peeke-cmms-erp-debug"; "i")) or (.name | test("apk"; "i")))
                    and (.expired == false)
                  )
                | "\(.id)\t\(.name)\t\(.created_at)\t\(.size_in_bytes)"
              ')
            else
              mapfile -t rows < <(echo "$resp" | jq -r --arg cutoff "$cutoff" '
                .artifacts[]
                | select(
                    ((.name | test("peeke-cmms-erp-debug"; "i")) or (.name | test("apk"; "i")))
                    and (.created_at < $cutoff)
                    and (.expired == false)
                  )
                | "\(.id)\t\(.name)\t\(.created_at)\t\(.size_in_bytes)"
              ')
            fi

            if [ ${#rows[@]} -eq 0 ]; then
              echo "Page $page: nothing matching."
            else
              for row in "${rows[@]}"; do
                id=$(echo "$row" | cut -f1)
                name=$(echo "$row" | cut -f2)
                created=$(echo "$row" | cut -f3)
                size=$(echo "$row" | cut -f4)
                echo "Deleting id=$id name=$name created=$created size=${size}B ..."
                code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${id}")
                if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                  deleted=$((deleted + 1))
                  echo "  OK ($code)"
                else
                  skipped=$((skipped + 1))
                  echo "  SKIP http=$code"
                fi
              done
            fi

            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Done. deleted=$deleted skipped=$skipped"
          echo "Note: GitHub quota meter updates asynchronously (often 6–12h, sometimes longer)."
