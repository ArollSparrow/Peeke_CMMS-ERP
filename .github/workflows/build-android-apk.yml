name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_r2:
        description: "Publish APK to Cloudflare R2 (recommended)"
        type: boolean
        default: true
      upload_github_artifact:
        description: "Also upload to GitHub Actions artifacts (uses free storage quota)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/branding/**"
      - "pubspec.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_github_artifact == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing APK artifacts
        env:
          OWNER: ArollSparrow
          REPO: Peeke_CMMS-ERP
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deleted=0
          page=1
          while true; do
            resp=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts?per_page=100&page=${page}")
            count=$(echo "$resp" | jq '.artifacts | length')
            if [ "$count" = "0" ] || [ "$count" = "null" ]; then
              break
            fi
            mapfile -t ids < <(echo "$resp" | jq -r '
              .artifacts[]
              | select(
                  ((.name | test("peeke-cmms-erp-debug"; "i")) or (.name | test("apk"; "i")))
                  and (.expired == false)
                )
              | .id
            ')
            for id in "${ids[@]:-}"; do
              [ -z "$id" ] && continue
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${id}")
              echo "delete $id -> $code"
              if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                deleted=$((deleted + 1))
              fi
            done
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Deleted $deleted APK artifact(s)."

  apk:
    needs: [cleanup]
    if: always() && (github.event_name == 'push' || needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://tappfahlaiixctyliesz.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          ls -lh build/app/outputs/flutter-apk/

      - name: Publish APK to R2
        id: r2
        if: github.event_name == 'workflow_dispatch' && inputs.publish_r2 == true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK" >&2
            exit 1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "Missing R2 secrets." >&2
            exit 1
          fi

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          STABLE_KEY="ci/apk/peeke-cmms-erp-debug.apk"
          DATED_KEY="ci/apk/peeke-cmms-erp-debug-${{ github.run_id }}.apk"

          aws s3 cp "$APK" "s3://${R2_BUCKET}/${STABLE_KEY}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.android.package-archive" \
            --only-show-errors

          aws s3 cp "$APK" "s3://${R2_BUCKET}/${DATED_KEY}" \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/vnd.android.package-archive" \
            --only-show-errors

          echo "stable_key=${STABLE_KEY}" >> "$GITHUB_OUTPUT"
          echo "dated_key=${DATED_KEY}" >> "$GITHUB_OUTPUT"
          echo "bucket=${R2_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "Published to s3://${R2_BUCKET}/${STABLE_KEY}"

      - name: Upload GitHub artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload_github_artifact == true
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: peeke-cmms-erp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          overwrite: true

      - name: Summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_R2: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_r2 || false }}
          GH_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_github_artifact || false }}
          R2_OK: ${{ steps.r2.outcome }}
        run: |
          {
            echo "### Android APK build"
            echo "- **Event:** \`$EVENT\`"
            echo "- **Build:** see job log for success/failure"
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH_R2" = "true" ]; then
              if [ "${R2_OK:-}" = "success" ]; then
                echo "- **R2:** published (\`ci/apk/peeke-cmms-erp-debug.apk\`)"
                echo "- **Download (short, always current):**"
                echo "  "
                echo "  **https://peeke-apk.peeke.workers.dev/**"
                echo "  "
                echo "  Opens a fresh 1-hour R2 link and starts the download."
              else
                echo "- **R2:** publish failed — check secrets"
              fi
            else
              echo "- **R2:** skipped"
            fi
            if [ "$EVENT" = "workflow_dispatch" ] && [ "$GH_ARTIFACT" = "true" ]; then
              echo "- **GitHub artifact:** requested"
            else
              echo "- **GitHub artifact:** skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
