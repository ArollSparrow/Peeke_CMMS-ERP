name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload APK to GitHub Actions artifacts (uses free storage quota)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/branding/**"
      - "pubspec.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  actions: write
  contents: read

jobs:
  # Only when manually requesting an artifact upload: wipe old APK artifacts first.
  cleanup:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_artifact == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing APK artifacts
        env:
          OWNER: ArollSparrow
          REPO: Peeke_CMMS-ERP
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deleted=0
          page=1
          while true; do
            resp=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts?per_page=100&page=${page}")
            count=$(echo "$resp" | jq '.artifacts | length')
            if [ "$count" = "0" ] || [ "$count" = "null" ]; then
              break
            fi
            mapfile -t ids < <(echo "$resp" | jq -r '
              .artifacts[]
              | select(
                  ((.name | test("peeke-cmms-erp-debug"; "i")) or (.name | test("apk"; "i")))
                  and (.expired == false)
                )
              | .id
            ')
            for id in "${ids[@]:-}"; do
              [ -z "$id" ] && continue
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${id}")
              echo "delete $id -> $code"
              if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                deleted=$((deleted + 1))
              fi
            done
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Deleted $deleted APK artifact(s). Quota meter may lag 6–12h."

  apk:
    needs: [cleanup]
    # Push: cleanup skipped → still run. Manual without upload: cleanup skipped → still run.
    if: always() && (github.event_name == 'push' || needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://tappfahlaiixctyliesz.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # Default: do NOT upload. Free-tier artifact quota is account-wide and
      # fills quickly (~50–80MB per APK). Push runs only verify the build.
      # Manual run: leave "Upload APK…" unchecked unless quota has recovered.
      # Future: optional R2 publish (see docs/EDGE_AND_STORAGE_OPTIMIZATIONS.md).
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifact == true
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: peeke-cmms-erp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          overwrite: true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android APK build"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **Build:** completed (see job log for success/failure)"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload_artifact }}" = "true" ]; then
              echo "- **Artifact upload:** requested (may fail if storage quota is still full)"
            else
              echo "- **Artifact upload:** skipped (quota-safe default)"
              echo "- **Get an APK:** run workflow manually with *Upload APK…* checked only after quota recovers, or build locally / publish to R2 later"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
