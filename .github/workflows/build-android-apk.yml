name: Build Android APK

on:
  # Manual only for artifact upload — avoids burning free Actions storage on every UI push.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/branding/**"
      - "pubspec.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  actions: write
  contents: read

jobs:
  # Only on manual runs: wipe existing APK artifacts first so upload has a chance.
  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing APK artifacts
        env:
          OWNER: ArollSparrow
          REPO: Peeke_CMMS-ERP
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deleted=0
          page=1
          while true; do
            resp=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts?per_page=100&page=${page}")
            count=$(echo "$resp" | jq '.artifacts | length')
            if [ "$count" = "0" ] || [ "$count" = "null" ]; then
              break
            fi
            mapfile -t ids < <(echo "$resp" | jq -r '
              .artifacts[]
              | select(
                  ((.name | test("peeke-cmms-erp-debug"; "i")) or (.name | test("apk"; "i")))
                  and (.expired == false)
                )
              | .id
            ')
            for id in "${ids[@]:-}"; do
              [ -z "$id" ] && continue
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${id}")
              echo "delete $id -> $code"
              if [ "$code" = "204" ] || [ "$code" = "200" ]; then
                deleted=$((deleted + 1))
              fi
            done
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          echo "Deleted $deleted APK artifact(s). Quota meter may lag 6–12h."

  apk:
    needs: [cleanup]
    # When push: no cleanup job → needs is skipped; use if so push still runs.
    if: always() && (github.event_name == 'push' || needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://tappfahlaiixctyliesz.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # Free plan artifact quota fills fast (APK ~50–80MB × many runs).
      # Upload only when manually triggered; push runs still verify the build.
      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: peeke-cmms-erp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          overwrite: true
