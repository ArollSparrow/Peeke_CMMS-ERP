name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "assets/branding/**"
      - "pubspec.yaml"
      - ".github/workflows/build-android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Apply launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://tappfahlaiixctyliesz.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      # Short retention + overwrite so we stay under free Actions artifact quota.
      # Recent "failures" were only upload quota (APK itself built fine).
      - name: Upload APK
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: peeke-cmms-erp-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
          overwrite: true
