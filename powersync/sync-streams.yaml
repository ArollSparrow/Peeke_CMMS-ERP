# Peeke CMMS-ERP — Sync Streams (PowerSync Cloud)
# Deploy via PowerSync Dashboard → Sync Streams (edition 3).
#
# Invariants:
# - Download filter ONLY — Postgres RLS remains authoritative on every write.
# - Every data stream is membership-scoped (organization_members).
# - Never sync payment secrets or platform-admin-only tables.
#
# Validate against live Supabase before Deploy.

config:
  edition: 3

streams:
  # --- Identity / membership (auto) ------------------------------------------
  my_memberships:
    auto_subscribe: true
    query: |
      SELECT * FROM organization_members
      WHERE user_id = auth.user_id()

  my_orgs:
    auto_subscribe: true
    query: |
      SELECT o.id, o.name, o.slug, o.status, o.testing_until, o.review_note,
             o.created_at, o.updated_at
      FROM organizations o
      INNER JOIN organization_members m ON m.organization_id = o.id
      WHERE m.user_id = auth.user_id()

  # --- Domain v1 (clients / systems) -----------------------------------------
  tenant_clients:
    auto_subscribe: true
    query: |
      SELECT c.* FROM clients c
      WHERE c.organization_id IN (
        SELECT organization_id FROM organization_members
        WHERE user_id = auth.user_id()
      )

  tenant_systems:
    auto_subscribe: true
    query: |
      SELECT s.* FROM systems s
      WHERE s.organization_id IN (
        SELECT organization_id FROM organization_members
        WHERE user_id = auth.user_id()
      )

  # --- Domain v1 (work) — enable when tables + RLS are confirmed -------------
  # tenant_work_orders:
  #   auto_subscribe: true
  #   query: |
  #     SELECT w.* FROM work_orders w
  #     WHERE w.organization_id IN (
  #       SELECT organization_id FROM organization_members
  #       WHERE user_id = auth.user_id()
  #     )

